server.address=127.0.0.1
server.port=8088
spring.datasource.url=jdbc:h2:file:./data/workbench;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# 数据库结构由 Flyway 版本化迁移管理；Hibernate 只做对象关系映射，不建表、不改表。
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,prometheus

# 单运行最多并行执行的就绪节点数（写集互斥仍由数据库认领强制）。
workbench.orchestration.max-parallel-nodes=3

# 历史固定模板默认保持顺序执行；带反思回边的新计划自动启用受控并行，也可全局开启。
workbench.orchestration.parallel-all-plans=false

# MCP 子进程命令白名单与超时；凭据仅以 AES-256-GCM 密文落库。
workbench.mcp.allowed-commands=node,npx,python,python3,uvx,docker
workbench.mcp.timeout-seconds=30

# 出站安全：公网只允许 https；本地模型服务（Ollama / vLLM 等）需要回环地址时必须显式开启。
# 开启后仅放行本机回环，私网、链路本地、云元数据与保留网段始终拒绝。
workbench.outbound.allow-loopback=true

# 可选 Embedding 向量端点；默认关闭，未配置时混合检索自动降级为 BM25，不阻塞主流程。
# 可复用已保存的 BYOK 连接（connection-id），或仅填写 OpenAI 兼容端点。
workbench.rag.embedding.enabled=false
workbench.rag.embedding.connection-id=
workbench.rag.embedding.base-url=
workbench.rag.embedding.model=
workbench.rag.embedding.api-key=
workbench.rag.embedding.dimension=1536
workbench.rag.embedding.timeout-seconds=20
workbench.rag.embedding.batch-size=32
