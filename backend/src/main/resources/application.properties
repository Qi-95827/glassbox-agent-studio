server.address=127.0.0.1
server.port=8088
spring.datasource.url=jdbc:h2:file:./data/workbench;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# 数据库结构由 Flyway 版本化迁移管理；Hibernate 只做对象关系映射，不建表、不改表。
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,prometheus

# 单运行最多并行执行的就绪节点数（写集互斥仍由数据库认领强制）。
workbench.orchestration.max-parallel-nodes=3

# 历史固定模板默认保持顺序执行；带反思回边的新计划自动启用受控并行，也可全局开启。
workbench.orchestration.parallel-all-plans=false

# MCP 子进程命令白名单与超时；凭据仅以 AES-256-GCM 密文落库。
workbench.mcp.allowed-commands=node,npx,python,python3,uvx,docker
workbench.mcp.timeout-seconds=30
